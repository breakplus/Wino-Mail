name: Build Wino Mail ARM64 (Sideload)

# Builds a native-ARM64 sideload .msixbundle from your fork, mirroring the
# upstream official release pipeline (scripts/release/windows/build-releases.ps1
# as of 2026-10-15), plus personal customizations:
#   - FreeAccountLimit 3 -> 99
#   - package identity renamed to WinoMail.Personal.ARM64 (coexists with Store version)
#   - self-signed cert for sideload install
#
# Key differences vs the earlier hand-written workflow (these are the likely
# causes of the 6 ILCompiler errors):
#   1. Uses `dotnet msbuild` with the repo-pinned .NET 10 SDK (actions/setup-dotnet),
#      NOT VS msbuild: VS 2022's SDK resolver cannot load .NET 10 (per upstream script).
#   2. Passes -p:Platform=arm64 so the csproj auto-selects the correct publish
#      profile Properties\PublishProfiles\win-arm64.pubxml (UseNativeAot=true,
#      SelfContained=true, TrimMode=full). Without it the wrong profile's
#      RuntimeIdentifier conflicts with the command-line RID -> ILC failures.
#   3. Restores with the repo's own nuget.config, like the official pipeline.
# AOT needs no extra switches: it is enabled by the csproj + pubxml properties
# for Release builds.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Raise FreeAccountLimit 3 -> 99
        shell: pwsh
        run: |
          $hit = Get-ChildItem -Path . -Recurse -Filter *.cs |
                 Select-String -Pattern 'FreeAccountLimit\s*=\s*3\b' |
                 Select-Object -First 1
          if (-not $hit) { throw 'FreeAccountLimit constant not found' }
          $p = $hit.Path
          (Get-Content $p -Raw) -replace 'FreeAccountLimit\s*=\s*3\b', 'FreeAccountLimit = 99' |
            Set-Content $p -NoNewline
          Write-Host "patched: $p"
          Select-String -Path $p -Pattern 'FreeAccountLimit'

      - name: Rename package identity + create self-signed cert
        shell: pwsh
        run: |
          $manifest = 'src/Wino.Mail.WinUI/Package.appxmanifest'
          [xml]$xml = Get-Content $manifest
          $xml.Package.Identity.Name = 'WinoMail.Personal.ARM64'
          $publisher = $xml.Package.Identity.Publisher
          $xml.Save((Resolve-Path $manifest).Path)
          Write-Host "package name -> WinoMail.Personal.ARM64 (publisher: $publisher)"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
                    -KeyUsage DigitalSignature -FriendlyName 'WinoMail Personal ARM64' `
                    -CertStoreLocation 'Cert:\CurrentUser\My' `
                    -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          $cerPath = "$env:GITHUB_WORKSPACE\WinoMail.Personal.ARM64.cer"
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          Write-Host "cert thumbprint: $($cert.Thumbprint)"
          Write-Host "cer exported: $cerPath"

      - name: Patch AOT PDB into PDBPayload
        shell: pwsh
        run: |
          # 上游 WinoExportReleaseSymbols 要求 AOT 的 PDB 必须在 @(PDBPayload) 里，
          # 但 MSIX 工具链不会自动收录 ILCompiler 生成的 PDB。这里加一个 target 补上。
          $targets = @'
          <Project>
            <Target Name="WinoAddAotPdbToPdbPayload"
                    AfterTargets="_CalculateInputsForGenerateAppxPackageRecipe"
                    BeforeTargets="WinoExportReleaseSymbols"
                    Condition="'`$(PublishAot)' == 'true' and '`$(Configuration)' == 'Release'">
              <ItemGroup>
                <PDBPayload Include="`$(OutputPath)`$(TargetName).pdb"
                            Condition="Exists('`$(OutputPath)`$(TargetName).pdb')" />
              </ItemGroup>
              <Message Text="WinoAddAotPdbToPdbPayload: added `$(TargetName).pdb to PDBPayload"
                       Importance="high" />
            </Target>
          </Project>
          '@
          $targets | Set-Content 'src/Wino.Mail.WinUI/WinoAotPdbFix.targets' -Encoding utf8
          # 临时 import 进 csproj（构建完即弃，不污染 fork）
          $csproj = 'src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj'
          $xml = [xml](Get-Content $csproj -Raw)
          $import = $xml.CreateElement('Import', $xml.Project.NamespaceURI)
          $import.SetAttribute('Project', 'WinoAotPdbFix.targets')
          $xml.Project.AppendChild($import) | Out-Null
          $xml.Save((Resolve-Path $csproj).Path)
          Write-Host 'patched csproj with WinoAotPdbFix.targets'

      - name: Setup .NET SDK (repo-pinned, .NET 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK
        shell: pwsh
        run: dotnet --info

      - name: Restore (repo nuget.config, as upstream does)
        shell: pwsh
        run: >
          dotnet msbuild src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj
          -t:Restore
          -p:RestoreConfigFile="$env:GITHUB_WORKSPACE/nuget.config"
          -p:ArtifactsPath="$env:GITHUB_WORKSPACE/staging/build"
          -p:RuntimeIdentifiers=win-arm64
          -nologo

      - name: Build ARM64 sideload MSIX (official pipeline invocation)
        shell: pwsh
        run: |
          $staging  = "$env:GITHUB_WORKSPACE\staging"
          $buildLog = "$env:GITHUB_WORKSPACE\build.log"
          New-Item -ItemType Directory -Force -Path "$staging\build" | Out-Null
          dotnet msbuild src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            -nologo -m -nr:false -verbosity:normal `
            -p:Configuration=Release `
            -p:Platform=arm64 `
            -p:RuntimeIdentifiers=win-arm64 `
            -p:ArtifactsPath="$staging\build" `
            -p:NotificationHostPublishRoot="$staging\notification-hosts\" `
            -p:WinoReleaseStagingRoot="$staging\exports" `
            -t:Build `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxBundle=Always `
            -p:AppxBundlePlatforms=ARM64 `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageDir="$staging\sdk\" `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint="$env:CERT_THUMBPRINT" `
            -p:AppxSymbolPackageEnabled=true `
            -p:GenerateTestArtifacts=false 2>&1 | Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show error lines on failure
        if: failure()
        shell: pwsh
        run: |
          '===== ERROR LINES ====='
          Select-String -Path "$env:GITHUB_WORKSPACE\build.log" `
            -Pattern 'error [A-Z]+[0-9]+|ILC\s*:|MakeAppx\s*:\s*error' |
            Select-Object -First 40

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload sideload package + cert
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WinoMail-ARM64-sideload
          path: |
            staging/sdk/*.msixbundle
            WinoMail.Personal.ARM64.cer
