name: Build Wino Mail ARM64 (Sideload)

# 手动触发：Actions 页面点 "Run workflow"
on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 1. 解除账户数量限制（改成 99）
      - name: Remove account limit
        shell: pwsh
        run: |
          $f = 'src/Wino.Core.Domain/Constants.cs'
          (Get-Content $f -Raw) -replace 'FreeAccountLimit = \d+', 'FreeAccountLimit = 99' |
            Set-Content $f -NoNewline
          Select-String 'FreeAccountLimit' $f

      # 2. 生成自签名证书（侧载安装用）
      - name: Create self-signed cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=WinoMail Personal" `
            -KeyUsage DigitalSignature `
            -FriendlyName "WinoMail Personal Sideload" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "wino" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\WinoMailPersonal.pfx" -Password $pwd
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\WinoMailPersonal.cer"
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      # 3. 修改 manifest 为侧载身份（避免与商店版冲突）
      - name: Patch manifest for sideload
        shell: pwsh
        run: |
          $m = 'src/Wino.Mail.WinUI/Package.appxmanifest'
          [xml]$xml = Get-Content $m -Raw
          $xml.Package.Identity.Name = 'WinoMail.Personal.ARM64'
          $xml.Package.Identity.Publisher = 'CN=WinoMail Personal'
          # Properties 显示名称
          $xml.Package.Properties.DisplayName = 'Wino Mail (Personal ARM64)'
          $xml.Save($m)

      # 4. 还原 NuGet 包（注意用复数 RuntimeIdentifiers，和官方发布脚本一致）
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            --configfile nuget.config -p:Platform=ARM64 -p:RuntimeIdentifiers=win-arm64

      # 5. 编译 + 打包 ARM64 AppxBundle
      - name: Build ARM64 AppxBundle
        shell: pwsh
        run: |
          msbuild src/Wino.Mail.WinUI/Wino.Mail.WinUI.csproj `
            -nologo -m -nr:false -verbosity:normal `
            -t:Build `
            -p:Configuration=Release `
            -p:Platform=ARM64 `
            -p:RuntimeIdentifiers=win-arm64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxBundle=Always `
            -p:AppxBundlePlatforms=arm64 `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint="${{ env.CERT_THUMBPRINT }}" `
            -p:PackageCertificateKeyFile="$env:RUNNER_TEMP\WinoMailPersonal.pfx" `
            -p:PackageCertificatePassword=wino

      # 6. 收集产物
      - name: Collect artifacts
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Recurse -Filter "*.msixbundle" `
            src/Wino.Mail.WinUI/AppPackages | Select-Object -First 1
          if (-not $bundle) { throw 'msixbundle not found' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $bundle.FullName out/
          Copy-Item "$env:RUNNER_TEMP\WinoMailPersonal.cer" out/
          Get-ChildItem out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wino-mail-arm64
          path: out/
